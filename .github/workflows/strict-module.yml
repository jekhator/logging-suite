name: strict-module

# DTO-discipline lint (frozen+slots, facade-ban, R001-R006). Per-repo copy of
# the canonical gate; runs on the root-layout package. Empty baseline at
# v0.2.0 (clean rebuild — 0 violations).
# Lint step: whole package (native test-file exemption via R007/R008 rules).
# LOC-cap step: source dirs only (test density exempt from cap per review record).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Run strict-module
        run: |
          echo "=== strict-module: logging_suite.latency ===" && \
          uvx --python 3.14 --from strict-suite==0.4.0 strict-module logging_suite/latency/ --format github && \
          echo "=== strict-module: logging_suite.logging ===" && \
          uvx --python 3.14 --from strict-suite==0.4.0 strict-module logging_suite/logging/ --format github && \
          echo "=== strict-module: logging_suite.notifications ===" && \
          uvx --python 3.14 --from strict-suite==0.4.0 strict-module logging_suite/notifications/ --format github && \
          echo "=== strict-module: logging_suite.retry ===" && \
          uvx --python 3.14 --from strict-suite==0.4.0 strict-module logging_suite/retry/ --format github && \
          echo "=== strict-module: logging_suite.sensitivity ===" && \
          uvx --python 3.14 --from strict-suite==0.4.0 strict-module logging_suite/sensitivity/ --format github
      - name: Check LOC cap
        run: |
          uvx --python 3.14 --from strict-suite==0.4.0 strict-module loc-cap logging_suite
